<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quantum Air Hockey</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #060b14;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #canvas { display: block; position: absolute; top: 0; left: 0; }

  /* ── Overlays ── */
  .overlay {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }

  /* ── ARCADE MENU ─────────────────────────────────────────── */
  #menu {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #04080f;
    z-index: 10;
    overflow: hidden;
  }

  /* Scan-line overlay */
  #menu::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none; z-index: 1;
  }

  /* Radial field glow behind everything */
  #menu::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 50%, rgba(30,80,180,0.22) 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 80% 50%, rgba(180,60,10,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(80,30,160,0.15) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  #menu > * { position: relative; z-index: 2; }

  /* Atom logo */
  .menu-atom {
    font-size: clamp(36px,7vw,72px);
    animation: atomSpin 6s linear infinite;
    display: block; margin-bottom: 8px;
    filter: drop-shadow(0 0 12px #00d4e8) drop-shadow(0 0 28px #3b82d4);
  }
  @keyframes atomSpin {
    0%   { transform: rotate(0deg) scale(1);   }
    50%  { transform: rotate(180deg) scale(1.08); }
    100% { transform: rotate(360deg) scale(1);  }
  }

  /* Title */
  #menu-title {
    text-align: center; line-height: 1.0; margin-bottom: 4px;
  }
  #menu-title .t-quantum {
    display: block;
    font-size: clamp(32px, 7vw, 80px);
    font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase;
    color: #00d4e8;
    text-shadow: 0 0 10px #00d4e8, 0 0 30px #3b82d4, 0 0 60px #3b82d4;
    animation: neonFlicker 4s ease-in-out infinite;
  }
  #menu-title .t-air {
    display: block;
    font-size: clamp(40px, 9vw, 100px);
    font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 8px #fff, 0 0 20px rgba(0,210,255,0.6);
  }
  #menu-title .t-hockey {
    display: block;
    font-size: clamp(40px, 9vw, 100px);
    font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase;
    color: #f97316;
    text-shadow: 0 0 10px #f97316, 0 0 28px #f97316, 0 0 55px rgba(249,115,22,0.5);
    animation: neonFlicker 5s ease-in-out 1s infinite;
  }
  @keyframes neonFlicker {
    0%,92%,100% { opacity: 1; }
    94% { opacity: 0.75; }
    96% { opacity: 1; }
    98% { opacity: 0.6; }
  }

  /* Tagline */
  .menu-tag {
    font-size: clamp(11px, 1.6vw, 15px); letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(0,210,255,0.55); margin: 10px 0 28px;
  }

  /* Mode selector */
  .mode-row {
    display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; justify-content: center;
  }
  .mode-card {
    border: 2px solid rgba(0,210,255,0.25); border-radius: 6px;
    padding: 14px 24px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    text-align: center; min-width: 130px;
    background: rgba(0,15,35,0.7);
  }
  .mode-card:hover {
    border-color: #00d4e8;
    background: rgba(0,210,255,0.08);
    box-shadow: 0 0 14px rgba(0,210,255,0.3);
  }
  .mode-card.active {
    border-color: #00d4e8;
    background: rgba(0,210,255,0.12);
    box-shadow: 0 0 18px rgba(0,210,255,0.4), inset 0 0 10px rgba(0,210,255,0.06);
  }
  .mode-card .mc-title { font-size: 14px; font-weight: 800; color: #fff; letter-spacing: 0.06em; text-transform: uppercase; }
  .mode-card .mc-sub   { font-size: 11px; color: rgba(0,210,255,0.6); margin-top: 4px; letter-spacing: 0.04em; }
  .mode-card.active .mc-title { color: #00d4e8; text-shadow: 0 0 8px #00d4e8; }

  /* Buttons */
  .btn {
    padding: 14px 56px; border-radius: 4px; border: none;
    font-size: clamp(16px,2.5vw,20px); font-weight: 900; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.12em;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    background: transparent;
    color: #00d4e8;
    border: 2px solid #00d4e8;
    box-shadow: 0 0 14px rgba(0,210,255,0.5), inset 0 0 10px rgba(0,210,255,0.08);
    animation: btnPulse 2s ease-in-out infinite;
  }
  .btn-primary:hover {
    background: rgba(0,210,255,0.12);
    box-shadow: 0 0 28px rgba(0,210,255,0.8), inset 0 0 16px rgba(0,210,255,0.12);
  }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 14px rgba(0,210,255,0.5), inset 0 0 10px rgba(0,210,255,0.08); }
    50%     { box-shadow: 0 0 28px rgba(0,210,255,0.9), inset 0 0 18px rgba(0,210,255,0.14); }
  }
  .btn-secondary {
    background: transparent; color: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 11px; padding: 8px 28px; margin-top: 14px;
    letter-spacing: 0.1em;
  }
  .btn-secondary:hover { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.25); }

  /* Insert coin blink */
  .insert-coin {
    font-size: clamp(11px,1.5vw,14px); letter-spacing: 0.22em; text-transform: uppercase;
    color: #f97316; margin-top: 18px;
    animation: coinBlink 1.1s step-start infinite;
  }
  @keyframes coinBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  /* Neon corner decorations */
  .menu-corners {
    position: absolute; inset: 20px; pointer-events: none; z-index: 2;
  }
  .menu-corners span {
    position: absolute; width: 28px; height: 28px;
    border-color: rgba(0,210,255,0.4); border-style: solid;
  }
  .menu-corners span:nth-child(1) { top:0; left:0;  border-width: 2px 0 0 2px; }
  .menu-corners span:nth-child(2) { top:0; right:0; border-width: 2px 2px 0 0; }
  .menu-corners span:nth-child(3) { bottom:0; left:0;  border-width: 0 0 2px 2px; }
  .menu-corners span:nth-child(4) { bottom:0; right:0; border-width: 0 2px 2px 0; }

  /* Goal overlay */
  #goal-overlay {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    pointer-events: none; z-index: 8;
  }
  #goal-overlay.show { display: flex; }
  #goal-text {
    font-size: clamp(40px, 8vw, 96px); font-weight: 900; letter-spacing: -0.03em;
    text-shadow: 0 0 40px currentColor;
    animation: goalPop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes goalPop {
    from { transform: scale(0.3); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  /* Win screen */
  #win-screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(6,11,20,0.95); z-index: 10;
  }
  #win-screen.show { display: flex; }
  #win-screen h2 { font-size: clamp(24px,4vw,48px); color: #fff; font-weight: 900; }
  #win-screen .score-big { font-size: clamp(40px,8vw,96px); font-weight: 900; margin: 10px 0 10px; letter-spacing: 0.04em; }
  #win-screen .edu-summary { color: #8b949e; font-size: 14px; text-align: center; max-width: 420px; margin-bottom: 24px; line-height: 1.6; }

  /* ── Gate card buttons (HTML overlay, bottom bar) ── */
  #gate-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: none;
    height: 90px;
    background: rgba(6,11,20,0.88);
    border-top: 1px solid rgba(255,255,255,0.08);
    align-items: center; justify-content: space-between;
    padding: 0 16px;
    z-index: 6;
  }
  #gate-bar.show { display: flex; }

  .gate-side {
    display: flex; gap: 8px; align-items: center;
  }
  .gate-btn {
    width: 62px; height: 62px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff; font-size: 11px; font-weight: 700;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    transition: transform 0.1s, border-color 0.1s;
    position: relative;
  }
  .gate-btn:active { transform: scale(0.93); }
  .gate-btn.disabled { opacity: 0.35; pointer-events: none; }
  .gate-btn .gate-symbol { font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .gate-btn .gate-symbol svg { display: block; color: inherit; }
  .gate-btn .gate-cost   { font-size: 9px; color: #8b949e; }

  /* Colour-coded gates */
  .gate-btn[data-gate="H"] { border-color: rgba(59,130,212,0.5);  }
  .gate-btn[data-gate="X"] { border-color: rgba(199,53,83,0.5);   }
  .gate-btn[data-gate="Z"] { border-color: rgba(124,92,216,0.5);  }
  .gate-btn[data-gate="CNOT"] { border-color: rgba(45,160,90,0.5); }

  .gate-btn[data-gate="H"]:hover    { background: rgba(59,130,212,0.2); }
  .gate-btn[data-gate="X"]:hover    { background: rgba(199,53,83,0.2); }
  .gate-btn[data-gate="Z"]:hover    { background: rgba(124,92,216,0.2); }
  .gate-btn[data-gate="CNOT"]:hover { background: rgba(45,160,90,0.2); }

  /* Energy bars */
  .energy-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .energy-label { font-size: 10px; color: #57606a; font-weight: 600; letter-spacing: 0.06em; }
  .energy-bar-bg {
    width: 90px; height: 7px; border-radius: 4px;
    background: rgba(255,255,255,0.1); overflow: hidden;
  }
  .energy-bar-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.2s;
    background: linear-gradient(90deg, #00d4e8, #3b82d4);
  }
  .energy-val { font-size: 12px; color: #fff; font-weight: 700; }

  /* Qubit state mini display */
  .qubit-display {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .qubit-label { font-size: 9px; color: #57606a; font-weight: 600; letter-spacing: 0.06em; }
  .qubit-state-box {
    font-size: 13px; font-weight: 900; color: #fff;
    background: rgba(255,255,255,0.07); border-radius: 5px;
    padding: 3px 8px; min-width: 40px; text-align: center;
  }

  /* Centre circuit display */
  #circuit-display {
    display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;
    padding: 0 20px;
  }
  .circuit-label { font-size: 9px; color: #57606a; letter-spacing: 0.08em; font-weight: 600; }
  .circuit-row { display: flex; align-items: center; gap: 4px; }
  .circuit-qubit-label { font-size: 10px; color: #8b949e; width: 24px; text-align: right; }
  .circuit-line {
    display: flex; align-items: center; gap: 3px;
    background: rgba(255,255,255,0.04); border-radius: 4px;
    padding: 2px 6px; min-width: 160px;
  }
  .circuit-slot {
    width: 28px; height: 22px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3);
    border: 1px dashed rgba(255,255,255,0.1);
  }
  .circuit-slot.filled { color: #fff; border-style: solid; }
  .circuit-slot.gate-H    { background: rgba(59,130,212,0.3);  border-color: #3b82d4; }
  .circuit-slot.gate-X    { background: rgba(199,53,83,0.3);   border-color: #c73553; }
  .circuit-slot.gate-Z    { background: rgba(124,92,216,0.3);  border-color: #7c5cd8; }
  .circuit-slot.gate-CNOT { background: rgba(45,160,90,0.3);   border-color: #2da05a; }

  /* Q-BOT message */
  #qbot-msg {
    position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
    background: rgba(13,17,23,0.9); border: 1px solid rgba(59,130,212,0.4);
    border-radius: 8px; padding: 7px 16px;
    color: #c8e6ff; font-size: 13px; font-weight: 500;
    pointer-events: none; z-index: 7;
    opacity: 0; transition: opacity 0.3s;
    white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  #qbot-msg.show { opacity: 1; }

  /* Puck mode badge */
  #puck-mode-badge {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    padding: 3px 12px; border-radius: 20px;
    pointer-events: none; z-index: 7;
    opacity: 0; transition: opacity 0.4s;
  }
  #puck-mode-badge.show { opacity: 1; }
  #puck-mode-badge.mode-SPLIT     { background: rgba(59,130,212,0.25);  color: #79b8ff;  border: 1px solid #3b82d4; }
  #puck-mode-badge.mode-ENTANGLED { background: rgba(124,92,216,0.25);  color: #c5a3ff;  border: 1px solid #7c5cd8; }
  #puck-mode-badge.mode-BELL      { background: rgba(45,160,90,0.25);   color: #7ee787;  border: 1px solid #2da05a; }
  #puck-mode-badge.mode-NORMAL    { background: rgba(255,255,255,0.08); color: #8b949e;  border: 1px solid #3b3f47; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- ── ARCADE MENU ── -->
<div id="menu">
  <!-- neon corner brackets -->
  <div class="menu-corners">
    <span></span><span></span><span></span><span></span>
  </div>

  <!-- spinning atom -->
  <span class="menu-atom">⚛</span>

  <!-- neon title -->
  <div id="menu-title">
    <span class="t-quantum">Quantum</span>
    <span class="t-air">Air</span>
    <span class="t-hockey">Hockey</span>
  </div>

  <p class="menu-tag">2 Players &nbsp;·&nbsp; Touch · Gamepad · Keys &nbsp;·&nbsp; First to 7</p>

  <!-- mode selector -->
  <div class="mode-row">
    <div class="mode-card active" data-mode="classic">
      <div class="mc-title">Classic</div>
      <div class="mc-sub">Pure air hockey</div>
    </div>
    <div class="mode-card" data-mode="quantum">
      <div class="mc-title">⚛ Quantum</div>
      <div class="mc-sub">Gates · Bell states</div>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-start">▶ &nbsp;Start Game</button>
  <button class="btn btn-secondary" id="btn-controls">P1: WASD / Gamepad 1 &nbsp;·&nbsp; P2: Arrows / Gamepad 2</button>
  <div class="insert-coin">Insert coin to play</div>
</div>

<!-- ── GOAL FLASH ── -->
<div id="goal-overlay">
  <div id="goal-text">GOAL!</div>
</div>

<!-- ── WIN SCREEN ── -->
<div id="win-screen">
  <h2 id="win-label">Player 1 Wins!</h2>
  <div class="score-big" id="win-score"></div>
  <div class="edu-summary" id="win-edu"></div>
  <button class="btn btn-primary"   id="btn-rematch">REMATCH</button>
  <button class="btn btn-secondary" id="btn-menu-back">Main Menu</button>
</div>

<!-- ── GATE BAR (Quantum mode only) ── -->
<div id="gate-bar">
  <!-- P1 side (left) -->
  <div class="gate-side" id="p1-gates">
    <div class="qubit-display">
      <div class="qubit-label">Q0</div>
      <div class="qubit-state-box" id="q0-state">|0⟩</div>
    </div>
    <div class="energy-wrap">
      <div class="energy-label">P1 ENERGY</div>
      <div class="energy-bar-bg"><div class="energy-bar-fill" id="p1-energy-fill" style="width:100%"></div></div>
      <div class="energy-val" id="p1-energy-val">100</div>
    </div>
    <button class="gate-btn" data-gate="H" data-player="0"><span class="gate-symbol">H</span><span class="gate-cost">20⚡</span></button>
    <button class="gate-btn" data-gate="X" data-player="0"><span class="gate-symbol">X</span><span class="gate-cost">10⚡</span></button>
    <button class="gate-btn" data-gate="Z" data-player="0"><span class="gate-symbol">Z</span><span class="gate-cost">10⚡</span></button>
    <button class="gate-btn" data-gate="CNOT" data-player="0"><span class="gate-symbol"><svg width="22" height="28" viewBox="0 0 22 28" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="0" x2="11" y2="28" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="6" r="3.5" fill="currentColor"/><circle cx="11" cy="22" r="6" stroke="currentColor" stroke-width="1.5"/><line x1="5" y1="22" x2="17" y2="22" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="16" x2="11" y2="28" stroke="currentColor" stroke-width="1.5"/></svg></span><span class="gate-cost">35⚡</span></button>
  </div>

  <!-- Centre circuit visualiser -->
  <div id="circuit-display">
    <div class="circuit-label">QUANTUM CIRCUIT</div>
    <div class="circuit-row">
      <span class="circuit-qubit-label">Q0</span>
      <div class="circuit-line" id="circuit-q0"></div>
    </div>
    <div class="circuit-row">
      <span class="circuit-qubit-label">Q1</span>
      <div class="circuit-line" id="circuit-q1"></div>
    </div>
  </div>

  <!-- P2 side (right) -->
  <div class="gate-side" id="p2-gates" style="flex-direction:row-reverse">
    <div class="qubit-display">
      <div class="qubit-label">Q1</div>
      <div class="qubit-state-box" id="q1-state">|0⟩</div>
    </div>
    <div class="energy-wrap">
      <div class="energy-label">P2 ENERGY</div>
      <div class="energy-bar-bg"><div class="energy-bar-fill" id="p2-energy-fill" style="width:100%"></div></div>
      <div class="energy-val" id="p2-energy-val">100</div>
    </div>
    <button class="gate-btn" data-gate="H" data-player="1"><span class="gate-symbol">H</span><span class="gate-cost">20⚡</span></button>
    <button class="gate-btn" data-gate="X" data-player="1"><span class="gate-symbol">X</span><span class="gate-cost">10⚡</span></button>
    <button class="gate-btn" data-gate="Z" data-player="1"><span class="gate-symbol">Z</span><span class="gate-cost">10⚡</span></button>
    <button class="gate-btn" data-gate="CNOT" data-player="1"><span class="gate-symbol"><svg width="22" height="28" viewBox="0 0 22 28" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="0" x2="11" y2="28" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="6" r="3.5" fill="currentColor"/><circle cx="11" cy="22" r="6" stroke="currentColor" stroke-width="1.5"/><line x1="5" y1="22" x2="17" y2="22" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="16" x2="11" y2="28" stroke="currentColor" stroke-width="1.5"/></svg></span><span class="gate-cost">35⚡</span></button>
  </div>
</div>

<!-- Q-BOT message -->
<div id="qbot-msg"></div>
<!-- Puck mode badge -->
<div id="puck-mode-badge"></div>

<script>
"use strict";

// ═══════════════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════
const GOALS_TO_WIN     = 7;
const PHYSICS_HZ       = 120;
const PHYSICS_DT       = 1 / PHYSICS_HZ;
const MAX_PUCK_SPEED   = 7;
const MAX_PAD_SPEED    = 1.8;
const PAD_ACCEL        = 12;
const PAD_DECEL        = 16;
const PUCK_FRICTION    = 0.998;
const RESTITUTION_WALL = 0.98;
const RESTITUTION_PAD  = 0.85;
const GOAL_PAUSE_MS    = 2000;
const COUNTDOWN_MS     = 1000;
const DEADZONE         = 0.08;

const FIELD_W = 1.90;
const FIELD_H = 1.00;
const GOAL_W  = 0.26;
const PUCK_R  = 0.038;
const PAD_R   = 0.065;

const GATE_COST = { H: 20, X: 10, Z: 10, CNOT: 35 };
const ENERGY_MAX = 100;
const SPLIT_DURATION = 6;   // seconds before auto-collapse

// ═══════════════════════════════════════════════════════════════════════════
// CANVAS & SCALE
// ═══════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");

let scale = 1, OX = 0, OY = 0;

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const usableH = gameMode === "quantum"
    ? canvas.height - 90
    : canvas.height;
  scale = Math.min(canvas.width / FIELD_W, usableH / FIELD_H);
  OX = Math.max(0, (canvas.width  - FIELD_W * scale) / 2);
  OY = Math.max(0, (usableH       - FIELD_H * scale) / 2);
}
window.addEventListener("resize", resize);

function px(m)  { return m * scale; }
function fx(mx) { return OX + mx * scale; }
function fy(my) { return OY + my * scale; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

// ═══════════════════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════════════════
let gameMode = "classic";   // "classic" | "quantum"

const state = {
  phase: "menu",   // menu | countdown | play | goal | win
  score: [0, 0],
  countdown: 0,
  lastGoalBy: -1,
  accumulator: 0,
  lastTime: 0,
  energy: [ENERGY_MAX, ENERGY_MAX],
  rallyCount: 0,
};

// ═══════════════════════════════════════════════════════════════════════════
// ENTITIES
// ═══════════════════════════════════════════════════════════════════════════
function makePuck() {
  return {
    x: FIELD_W / 2, y: FIELD_H / 2,
    vx: 0, vy: 0, r: PUCK_R,
    prevX: FIELD_W / 2, prevY: FIELD_H / 2,
    // quantum visual state
    mode: "NORMAL",        // NORMAL | SPLIT
    ghostX: FIELD_W / 2, ghostY: FIELD_H / 2,
    ghostVx: 0, ghostVy: 0,
    splitTimer: 0,         // counts down to auto-collapse
  };
}

function makePaddle(side) {
  const x = side === 0 ? FIELD_W * 0.18 : FIELD_W * 0.82;
  return {
    x, y: FIELD_H / 2, vx: 0, vy: 0, r: PAD_R, side,
    inputX: 0, inputY: 0,
    touchId: -1, touchStartX: 0, touchStartY: 0,
    touchPadOriginX: 0, touchPadOriginY: 0,
  };
}

let puck    = makePuck();
let paddles = [makePaddle(0), makePaddle(1)];

function resetPuck(lastGoalBy) {
  puck.x = FIELD_W / 2; puck.y = FIELD_H / 2;
  const dir = lastGoalBy === 0 ? 1 : -1;
  const angle = (Math.random() - 0.5) * 0.6;
  puck.vx = dir * 2.5 * Math.cos(angle);
  puck.vy = 2.5 * Math.sin(angle);
  puck.prevX = puck.x; puck.prevY = puck.y;
  // collapse any quantum state on reset
  puck.mode = "NORMAL";
  puck.splitTimer = 0;
}

function resetPaddles() {
  paddles[0].x = FIELD_W * 0.18; paddles[0].y = FIELD_H / 2;
  paddles[1].x = FIELD_W * 0.82; paddles[1].y = FIELD_H / 2;
  paddles.forEach(p => { p.vx = 0; p.vy = 0; p.inputX = 0; p.inputY = 0; });
}

// ═══════════════════════════════════════════════════════════════════════════
// QUANTUM ENGINE  (pure 2-qubit state vector simulation)
// ═══════════════════════════════════════════════════════════════════════════
// State: |ψ⟩ = α|00⟩ + β|01⟩ + γ|10⟩ + δ|11⟩
// Represented as complex array: [re00,im00, re01,im01, re10,im10, re11,im11]

const QE = (() => {
  let sv = [1,0, 0,0, 0,0, 0,0];  // |00⟩

  function reset() { sv = [1,0, 0,0, 0,0, 0,0]; }

  // Apply a 2×2 unitary to qubit q (0 or 1); other qubit is identity
  // U = [[a,b],[c,d]] (complex: a=[are,aim], etc.)
  function applyOne(q, are,aim, bre,bim, cre,cim, dre,dim) {
    const n = [0,0, 0,0, 0,0, 0,0];
    for (let i = 0; i < 4; i++) {
      const bit = (i >> (1 - q)) & 1;  // bit of qubit q in basis index i
      const other = i ^ (bit << (1 - q));
      const ire = sv[i*2], iim = sv[i*2+1];
      // row of U corresponding to bit
      if (bit === 0) {
        // U[0][0]*|...0...⟩ + U[0][1]*|...1...⟩
        // contributes to output basis where qubit q = 0 → same index
        n[i*2]   += are * ire - aim * iim;  n[i*2+1] += are * iim + aim * ire;
      } else {
        n[i*2]   += dre * ire - dim * iim;  n[i*2+1] += dre * iim + dim * ire;
      }
      // off-diagonal contributions
      if (bit === 0) {
        const j = i | (1 << (1 - q));      // flip qubit q: 0→1
        const jre = sv[j*2], jim = sv[j*2+1];
        n[i*2]   += bre * jre - bim * jim;  n[i*2+1] += bre * jim + bim * jre;
      } else {
        const j = i & ~(1 << (1 - q));
        const jre = sv[j*2], jim = sv[j*2+1];
        n[i*2]   += cre * jre - cim * jim;  n[i*2+1] += cre * jim + cim * jre;
      }
    }
    sv = n;
  }

  // Proper single-qubit application (clean version)
  function applyU1(q, U) {
    // U = [[re,im],[re,im] ; [re,im],[re,im]] as [a,b,c,d] each [re,im]
    const [a,b,c,d] = U;
    const ns = [0,0, 0,0, 0,0, 0,0];
    for (let i = 0; i < 4; i++) {
      // qubit q is bit (1-q) in little-endian: q=0 → bit1, q=1 → bit0
      const bitPos = 1 - q;
      const bitVal = (i >> bitPos) & 1;
      const iAmp = [sv[i*2], sv[i*2+1]];
      // This basis vector |i⟩ contributes to two output states
      // Output: same index with qubit q = 0: idx0, qubit q = 1: idx1
      const idx0 = i & ~(1 << bitPos);
      const idx1 = i |  (1 << bitPos);
      const row = bitVal === 0 ? [a, b] : [c, d];
      // gate row maps: input bit 0 → row[0], input bit 1 → row[1]
      // actually: Uq|b⟩ = sum_j U[j][b] |j⟩  — column b of U
      const col = bitVal === 0 ? [a, c] : [b, d];
      // add col[0]*amp to idx0, col[1]*amp to idx1
      const [cr0, ci0] = col[0];
      const [cr1, ci1] = col[1];
      ns[idx0*2]   += cr0 * iAmp[0] - ci0 * iAmp[1];
      ns[idx0*2+1] += cr0 * iAmp[1] + ci0 * iAmp[0];
      ns[idx1*2]   += cr1 * iAmp[0] - ci1 * iAmp[1];
      ns[idx1*2+1] += cr1 * iAmp[1] + ci1 * iAmp[0];
    }
    // undo double-counting: each basis state was iterated once,
    // but both idx0 and idx1 were written for each — need a clean accumulate
    // Redo with zero-init per output:
    const out = [0,0, 0,0, 0,0, 0,0];
    for (let inp = 0; inp < 4; inp++) {
      const bitPos = 1 - q;
      const b = (inp >> bitPos) & 1;
      const are = sv[inp*2], aim = sv[inp*2+1];
      // column b of U: U[0][b]=col0, U[1][b]=col1
      const [c0r, c0i] = b === 0 ? U[0] : U[1];
      const [c1r, c1i] = b === 0 ? U[2] : U[3];
      const out0 = inp & ~(1 << bitPos);
      const out1 = inp |  (1 << bitPos);
      out[out0*2]   += c0r * are - c0i * aim;
      out[out0*2+1] += c0r * aim + c0i * are;
      out[out1*2]   += c1r * are - c1i * aim;
      out[out1*2+1] += c1r * aim + c1i * are;
    }
    sv = out;
  }

  // CNOT: control=q0, target=q1
  function applyCNOT() {
    const ns = sv.slice();
    // Swap amplitudes |10⟩ ↔ |11⟩  (index 2 ↔ 3)
    ns[4] = sv[6]; ns[5] = sv[7];
    ns[6] = sv[4]; ns[7] = sv[5];
    sv = ns;
  }

  // Gates (unitary matrices as [[re,im], ...] columns):
  const INV2 = 1 / Math.SQRT2;
  const GATES = {
    H:    [[INV2,0], [INV2,0], [INV2,0], [-INV2,0]],
    X:    [[0,0],    [1,0],    [1,0],    [0,0]],
    Z:    [[1,0],    [0,0],    [0,0],    [-1,0]],
  };

  function applyGate(name, qubit) {
    if (name === "CNOT") { applyCNOT(); return; }
    applyU1(qubit, GATES[name]);
  }

  // Measure qubit q in computational basis; collapse state; return 0 or 1
  function measure(q) {
    const bitPos = 1 - q;
    let prob1 = 0;
    for (let i = 0; i < 4; i++) {
      if ((i >> bitPos) & 1) {
        prob1 += sv[i*2]*sv[i*2] + sv[i*2+1]*sv[i*2+1];
      }
    }
    const result = Math.random() < prob1 ? 1 : 0;
    // Collapse
    const ns = [0,0, 0,0, 0,0, 0,0];
    let norm = 0;
    for (let i = 0; i < 4; i++) {
      const bit = (i >> bitPos) & 1;
      if (bit === result) {
        ns[i*2] = sv[i*2]; ns[i*2+1] = sv[i*2+1];
        norm += sv[i*2]*sv[i*2] + sv[i*2+1]*sv[i*2+1];
      }
    }
    const f = 1 / Math.sqrt(norm || 1);
    for (let i = 0; i < 8; i++) ns[i] *= f;
    sv = ns;
    return result;
  }

  // Probability of measuring |1⟩ for qubit q
  function prob1(q) {
    const bitPos = 1 - q;
    let p = 0;
    for (let i = 0; i < 4; i++) {
      if ((i >> bitPos) & 1) p += sv[i*2]*sv[i*2] + sv[i*2+1]*sv[i*2+1];
    }
    return p;
  }

  // Human-readable dominant state label
  function stateLabel(q) {
    const p = prob1(q);
    if (p < 0.05) return "|0⟩";
    if (p > 0.95) return "|1⟩";
    return "|+⟩";  // superposition
  }

  function getSV() { return sv.slice(); }

  return { reset, applyGate, measure, prob1, stateLabel, getSV };
})();

// Gate queue: list of { gate, qubit, player, time }
const gateLog = [];

// ═══════════════════════════════════════════════════════════════════════════
// ENERGY SYSTEM
// ═══════════════════════════════════════════════════════════════════════════
function addEnergy(player, amount) {
  state.energy[player] = Math.min(ENERGY_MAX, state.energy[player] + amount);
  updateEnergyUI();
}

function spendEnergy(player, amount) {
  state.energy[player] = Math.max(0, state.energy[player] - amount);
  updateEnergyUI();
}

function updateEnergyUI() {
  for (let i = 0; i < 2; i++) {
    const pct = (state.energy[i] / ENERGY_MAX * 100).toFixed(0);
    document.getElementById(`p${i+1}-energy-fill`).style.width = pct + "%";
    document.getElementById(`p${i+1}-energy-val`).textContent  = Math.round(state.energy[i]);
  }
  refreshGateBtnStates();
}

function refreshGateBtnStates() {
  document.querySelectorAll(".gate-btn").forEach(btn => {
    const p = parseInt(btn.dataset.player);
    const cost = GATE_COST[btn.dataset.gate];
    btn.classList.toggle("disabled", state.energy[p] < cost || state.phase !== "play");
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// GATE EXECUTION
// ═══════════════════════════════════════════════════════════════════════════
// Player 0 controls Q0, Player 1 controls Q1
function fireGate(gate, player) {
  if (state.phase !== "play") return;
  const cost = GATE_COST[gate];
  if (state.energy[player] < cost) return;
  spendEnergy(player, cost);

  const qubit = player;  // P0 → Q0, P1 → Q1
  QE.applyGate(gate, qubit);
  gateLog.push({ gate, qubit, player, t: Date.now() });
  if (gateLog.length > 8) gateLog.shift();

  updateCircuitDisplay();
  updateQubitStateUI();
  applyQuantumEffect(gate, player);
}

// ─── helpers for spawn ────────────────────────────────────────────────────────
function spawnSplit(timerMult) {
  // Two visually IDENTICAL pucks. realIs: 0=main is real, 1=ghost is real.
  // Secret chosen now — never revealed until collapse.
  puck.realIs = Math.random() < 0.5 ? 0 : 1;
  const spd   = Math.hypot(puck.vx, puck.vy) || 2.5;
  const base  = Math.atan2(puck.vy, puck.vx);
  const diff  = (Math.random() - 0.5) * 0.6;
  puck.ghostX  = puck.x + (Math.random()-0.5)*0.07;
  puck.ghostY  = puck.y + (Math.random()-0.5)*0.07;
  puck.ghostVx = spd * Math.cos(base + diff);
  puck.ghostVy = spd * Math.sin(base + diff);
  puck.splitTimer   = SPLIT_DURATION * timerMult;
  puck.shimmerPhase = Math.random() * Math.PI * 2;
}

function applyQuantumEffect(gate, player) {
  // Detect Bell-state sequence: last gate on the other qubit was H → now CNOT
  const lastGate = gateLog.length >= 2 ? gateLog[gateLog.length - 2] : null;
  const isBellSetup = gate === "CNOT" &&
    lastGate && lastGate.gate === "H" && lastGate.qubit !== player;

  if (gate === "H") {
    // ── SUPERPOSITION: two identical pucks, only one real ────────────────
    puck.mode = "SPLIT";
    spawnSplit(1);
    showPuckModeBadge("SPLIT");
    playSound("gate_H");
    qbotSay("H gate: superposition! Both pucks look real — 50 / 50.");

  } else if (gate === "X") {
    // ── REVERSE: flip velocity ───────────────────────────────────────────
    puck.vx *= -0.9;
    puck.vy *= -0.9;
    playSound("gate_X");
    qbotSay("X gate: qubit flipped — puck reversed!");

  } else if (gate === "Z") {
    // ── PHASE: lateral kick ──────────────────────────────────────────────
    const perp = Math.hypot(puck.vx, puck.vy) * 0.4;
    puck.vy += perp * (Math.random() > 0.5 ? 1 : -1);
    const sp2 = Math.hypot(puck.vx, puck.vy);
    if (sp2 > MAX_PUCK_SPEED) { puck.vx *= MAX_PUCK_SPEED/sp2; puck.vy *= MAX_PUCK_SPEED/sp2; }
    playSound("gate_Z");
    qbotSay("Z gate: phase shift — trajectory curved!");

  } else if (gate === "CNOT") {
    if (isBellSetup) {
      // ── BELL STATE Φ⁺ = (|00⟩+|11⟩)/√2 ─────────────────────────────
      // Both pucks move INDEPENDENTLY but their measurement outcomes are
      // perfectly correlated: when one is "real", the other's reality
      // is determined by the same hidden variable (same coin flip).
      // Visually: green-purple entangled arc, matched shimmer.
      puck.mode = "BELL";
      puck.realIs     = Math.random() < 0.5 ? 0 : 1;   // shared hidden var
      puck.splitTimer = SPLIT_DURATION * 2;
      puck.shimmerPhase = 0;    // in-phase shimmer — they pulse together

      // Ghost spawns on the opposite half, heading toward P2's goal
      const spd = Math.hypot(puck.vx, puck.vy) || 2.5;
      puck.ghostX  = FIELD_W - puck.x;
      puck.ghostY  = FIELD_H / 2 + (Math.random()-0.5)*0.3;
      // Ghost heads the opposite direction (toward the other goal)
      puck.ghostVx = -Math.abs(puck.vx || spd * 0.7);
      puck.ghostVy = puck.vy * 0.5 + (Math.random()-0.5)*0.3;

      showPuckModeBadge("BELL");
      playSound("gate_CNOT");
      qbotSay("BELL STATE Φ⁺! Entangled pair — measuring one instantly collapses both.");
    } else {
      // ── CNOT only: standard entangled split ──────────────────────────
      puck.mode = "ENTANGLED";
      spawnSplit(1.5);
      // Ghost travels perpendicular to real puck
      const spd = Math.hypot(puck.vx, puck.vy) || 2;
      puck.ghostVx =  puck.vy  * 0.9;   // rotate 90°
      puck.ghostVy = -puck.vx  * 0.9;
      showPuckModeBadge("ENTANGLED");
      playSound("gate_CNOT");
      qbotSay("CNOT: entangled pair! Both are equally likely to be real.");
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// QUANTUM UI HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function updateQubitStateUI() {
  document.getElementById("q0-state").textContent = QE.stateLabel(0);
  document.getElementById("q1-state").textContent = QE.stateLabel(1);
}

function updateCircuitDisplay() {
  const q0el = document.getElementById("circuit-q0");
  const q1el = document.getElementById("circuit-q1");
  // Last 5 gates per qubit
  const q0gates = gateLog.filter(g => g.qubit === 0).slice(-5);
  const q1gates = gateLog.filter(g => g.qubit === 1).slice(-5);

  function renderLine(el, gates) {
    el.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      const slot = document.createElement("div");
      slot.className = "circuit-slot";
      if (gates[i]) {
        if (gates[i].gate === "CNOT") {
          slot.innerHTML = '<svg width="12" height="16" viewBox="0 0 22 28" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="0" x2="11" y2="28" stroke="currentColor" stroke-width="2"/><circle cx="11" cy="6" r="4" fill="currentColor"/><circle cx="11" cy="22" r="6.5" stroke="currentColor" stroke-width="2"/><line x1="4.5" y1="22" x2="17.5" y2="22" stroke="currentColor" stroke-width="2"/></svg>';
        } else {
          slot.textContent = gates[i].gate;
        }
        slot.classList.add("filled", `gate-${gates[i].gate}`);
      } else {
        slot.textContent = "·";
      }
      el.appendChild(slot);
    }
  }
  renderLine(q0el, q0gates);
  renderLine(q1el, q1gates);
}

// Q-BOT messages
let qbotTimer = null;
function qbotSay(msg) {
  const el = document.getElementById("qbot-msg");
  el.textContent = "⚛ Q-BOT: " + msg;
  el.classList.add("show");
  clearTimeout(qbotTimer);
  qbotTimer = setTimeout(() => el.classList.remove("show"), 3500);
}

function showPuckModeBadge(mode) {
  const el = document.getElementById("puck-mode-badge");
  el.textContent = mode;
  el.className = `show mode-${mode}`;
  setTimeout(() => { el.className = `mode-${mode}`; }, 2500);
}

// ═══════════════════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════════════════
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  // Keyboard gate shortcuts: Q/E for P1, U/O for P2
  if (state.phase === "play" && gameMode === "quantum") {
    if (e.code === "KeyQ") fireGate("H", 0);
    if (e.code === "KeyE") fireGate("X", 0);
    if (e.code === "KeyR") fireGate("Z", 0);
    if (e.code === "KeyF") fireGate("CNOT", 0);
    if (e.code === "KeyU") fireGate("H", 1);
    if (e.code === "KeyO") fireGate("X", 1);
    if (e.code === "KeyP") fireGate("Z", 1);
    if (e.code === "BracketLeft") fireGate("CNOT", 1);
  }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// Touch
canvas.addEventListener("touchstart",  onTouchStart,  { passive: false });
canvas.addEventListener("touchmove",   onTouchMove,   { passive: false });
canvas.addEventListener("touchend",    onTouchEnd,    { passive: false });
canvas.addEventListener("touchcancel", onTouchEnd,    { passive: false });

function mxFromPx(cpx) { return (cpx - OX) / scale; }
function myFromPy(cpy) { return (cpy - OY) / scale; }

function onTouchStart(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const mx = mxFromPx(t.clientX);
    for (let i = 0; i < 2; i++) {
      const p = paddles[i];
      if (p.touchId !== -1) continue;
      if (i === 0 && mx > FIELD_W / 2) continue;
      if (i === 1 && mx < FIELD_W / 2) continue;
      p.touchId = t.identifier;
      p.touchStartX = t.clientX; p.touchStartY = t.clientY;
      p.touchPadOriginX = p.x;   p.touchPadOriginY = p.y;
    }
  }
}

function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    for (const p of paddles) {
      if (p.touchId !== t.identifier) continue;
      p._touchTargetX = p.touchPadOriginX + (t.clientX - p.touchStartX) / scale;
      p._touchTargetY = p.touchPadOriginY + (t.clientY - p.touchStartY) / scale;
    }
  }
}

function onTouchEnd(e) {
  for (const t of e.changedTouches) {
    for (const p of paddles) {
      if (p.touchId === t.identifier) {
        p.touchId = -1;
        p._touchTargetX = undefined; p._touchTargetY = undefined;
      }
    }
  }
}

function applyDeadzone(v) {
  const a = Math.abs(v);
  if (a < DEADZONE) return 0;
  const norm = (a - DEADZONE) / (1 - DEADZONE);
  return Math.sign(v) * norm * norm * (3 - 2 * norm);
}

function readGamepad(idx) {
  const gp = (navigator.getGamepads ? navigator.getGamepads() : [])[idx];
  if (!gp) return { x: 0, y: 0, btn: [] };
  return {
    x: applyDeadzone(gp.axes[0] || 0),
    y: applyDeadzone(gp.axes[1] || 0),
    btn: gp.buttons.map(b => b.pressed),
  };
}

// Track gamepad button press (not hold) for gate firing
const gpBtnPrev = [[],[],[]];
function collectInput() {
  for (let i = 0; i < 2; i++) {
    const p = paddles[i];
    if (p.touchId !== -1 && p._touchTargetX !== undefined) continue;
    const gp = readGamepad(i);
    let ix = gp.x, iy = gp.y;
    if (i === 0) {
      if (keys["KeyA"]) ix -= 1; if (keys["KeyD"]) ix += 1;
      if (keys["KeyW"]) iy -= 1; if (keys["KeyS"]) iy += 1;
    } else {
      if (keys["ArrowLeft"])  ix -= 1; if (keys["ArrowRight"]) ix += 1;
      if (keys["ArrowUp"])    iy -= 1; if (keys["ArrowDown"])  iy += 1;
    }
    const len = Math.hypot(ix, iy);
    if (len > 1) { ix /= len; iy /= len; }
    p.inputX = ix; p.inputY = iy;

    // Gamepad gate buttons (quantum mode)
    if (gameMode === "quantum" && state.phase === "play") {
      const gates = ["H", "X", "Z", "CNOT"];
      const btnMap = [0, 2, 1, 3]; // A B X Y → H X Z CNOT
      for (let b = 0; b < 4; b++) {
        const pressed = gp.btn[btnMap[b]];
        const wasPressed = gpBtnPrev[i][b];
        if (pressed && !wasPressed) fireGate(gates[b], i);
        gpBtnPrev[i][b] = pressed;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PHYSICS
// ═══════════════════════════════════════════════════════════════════════════
function approach(cur, tgt, step) {
  const d = tgt - cur;
  if (Math.abs(d) <= step) return tgt;
  return cur + Math.sign(d) * step;
}

function stepPhysics(dt) {
  // Paddles
  for (let i = 0; i < 2; i++) {
    const p = paddles[i];
    if (p.touchId !== -1 && p._touchTargetX !== undefined) {
      const tx = clamp(p._touchTargetX, (i === 0 ? p.r : FIELD_W/2+p.r), (i === 0 ? FIELD_W/2-p.r : FIELD_W-p.r));
      const ty = clamp(p._touchTargetY, p.r, FIELD_H - p.r);
      const dxm = tx - p.x, dym = ty - p.y;
      const dist = Math.hypot(dxm, dym);
      const maxStep = MAX_PAD_SPEED * dt * 4;
      if (dist < 0.001) { p.vx = 0; p.vy = 0; }
      else {
        const step = Math.min(dist, maxStep);
        p.vx = (dxm/dist)*step/dt; p.vy = (dym/dist)*step/dt;
        p.x += (dxm/dist)*step;    p.y += (dym/dist)*step;
      }
    } else {
      const accel = (p.inputX || p.inputY) ? PAD_ACCEL : PAD_DECEL;
      p.vx = approach(p.vx, p.inputX * MAX_PAD_SPEED, accel * dt);
      p.vy = approach(p.vy, p.inputY * MAX_PAD_SPEED, accel * dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    const minX = i === 0 ? p.r : FIELD_W/2+p.r;
    const maxX = i === 0 ? FIELD_W/2-p.r : FIELD_W-p.r;
    p.x = clamp(p.x, minX, maxX);
    p.y = clamp(p.y, p.r, FIELD_H - p.r);
  }

  // Puck
  puck.prevX = puck.x; puck.prevY = puck.y;
  puck.vx *= PUCK_FRICTION; puck.vy *= PUCK_FRICTION;
  const sp = Math.hypot(puck.vx, puck.vy);
  if (sp > MAX_PUCK_SPEED) { puck.vx *= MAX_PUCK_SPEED/sp; puck.vy *= MAX_PUCK_SPEED/sp; }
  puck.x += puck.vx * dt; puck.y += puck.vy * dt;

  // Ghost puck movement + wall bounces (SPLIT / ENTANGLED / BELL all move)
  if (puck.mode === "SPLIT" || puck.mode === "ENTANGLED" || puck.mode === "BELL") {
    puck.ghostVx *= PUCK_FRICTION; puck.ghostVy *= PUCK_FRICTION;
    const gsp = Math.hypot(puck.ghostVx, puck.ghostVy);
    if (gsp > MAX_PUCK_SPEED) { puck.ghostVx *= MAX_PUCK_SPEED/gsp; puck.ghostVy *= MAX_PUCK_SPEED/gsp; }
    puck.ghostX += puck.ghostVx * dt;
    puck.ghostY += puck.ghostVy * dt;
    if (puck.ghostY - puck.r < 0)       { puck.ghostY = puck.r;         puck.ghostVy =  Math.abs(puck.ghostVy)*RESTITUTION_WALL; }
    if (puck.ghostY + puck.r > FIELD_H) { puck.ghostY = FIELD_H-puck.r; puck.ghostVy = -Math.abs(puck.ghostVy)*RESTITUTION_WALL; }
    if (puck.ghostX - puck.r < 0 && Math.abs(puck.ghostY - FIELD_H/2) >= GOAL_W/2) {
      puck.ghostX = puck.r; puck.ghostVx = Math.abs(puck.ghostVx)*RESTITUTION_WALL;
    }
    if (puck.ghostX + puck.r > FIELD_W && Math.abs(puck.ghostY - FIELD_H/2) >= GOAL_W/2) {
      puck.ghostX = FIELD_W-puck.r; puck.ghostVx = -Math.abs(puck.ghostVx)*RESTITUTION_WALL;
    }

    // Auto-collapse on timer
    puck.splitTimer -= dt;
    if (puck.splitTimer <= 0) collapseSplit(false);
  }

  // Wall collisions
  if (puck.y - puck.r < 0)       { puck.y = puck.r;         puck.vy =  Math.abs(puck.vy)*RESTITUTION_WALL; playSound("wall"); }
  if (puck.y + puck.r > FIELD_H) { puck.y = FIELD_H-puck.r; puck.vy = -Math.abs(puck.vy)*RESTITUTION_WALL; playSound("wall"); }

  const goalHalfW = GOAL_W / 2;
  const goalCY    = FIELD_H / 2;
  if (puck.x - puck.r < 0 && Math.abs(puck.y - goalCY) >= goalHalfW) {
    puck.x = puck.r; puck.vx = Math.abs(puck.vx)*RESTITUTION_WALL; playSound("wall");
  }
  if (puck.x + puck.r > FIELD_W && Math.abs(puck.y - goalCY) >= goalHalfW) {
    puck.x = FIELD_W-puck.r; puck.vx = -Math.abs(puck.vx)*RESTITUTION_WALL; playSound("wall");
  }

  // Paddle–puck collision (always uses main puck slot = real position after normalise)
  for (const pad of paddles) {
    const dx = puck.x - pad.x, dy = puck.y - pad.y;
    const d = Math.hypot(dx, dy);
    const minD = puck.r + pad.r;
    if (d < minD && d > 0.0001) {
      const nx = dx/d, ny = dy/d;
      const rvx = puck.vx - pad.vx, rvy = puck.vy - pad.vy;
      const rvDotN = rvx*nx + rvy*ny;
      if (rvDotN < 0) {
        const j = -(1 + RESTITUTION_PAD) * rvDotN;
        puck.vx += j*nx; puck.vy += j*ny;
        if (gameMode === "quantum") {
          addEnergy(pad.side, 10);
          state.rallyCount++;
          if (state.rallyCount % 5 === 0) {
            addEnergy(0, 15); addEnergy(1, 15);
            qbotSay("Long rally bonus! +15 energy each.");
          }
        }
        playSound("paddle");
      }
      puck.x += nx*(minD-d); puck.y += ny*(minD-d);
    }
    // Ghost puck also deflects off paddles (all quantum modes, cosmetic only)
    if (puck.mode === "SPLIT" || puck.mode === "ENTANGLED" || puck.mode === "BELL") {
      const gdx = puck.ghostX - pad.x, gdy = puck.ghostY - pad.y;
      const gd2 = Math.hypot(gdx, gdy);
      if (gd2 < minD && gd2 > 0.0001) {
        const gnx = gdx/gd2, gny = gdy/gd2;
        const grv = (puck.ghostVx-pad.vx)*gnx + (puck.ghostVy-pad.vy)*gny;
        if (grv < 0) {
          const gj = -(1 + RESTITUTION_PAD) * grv;
          puck.ghostVx += gj*gnx; puck.ghostVy += gj*gny;
        }
        puck.ghostX += gnx*(minD-gd2); puck.ghostY += gny*(minD-gd2);
      }
    }
  }

  // Wall bounce energy income
  if (gameMode === "quantum") {
    if (puck.y - puck.r < 0 || puck.y + puck.r > FIELD_H) addEnergy(0, 2.5), addEnergy(1, 2.5);
  }

  checkGoal();
}

// Normalise: ensure main puck slot always holds the REAL puck position.
function normaliseSplit() {
  if (puck.realIs === 1) {
    [puck.x, puck.ghostX]   = [puck.ghostX, puck.x];
    [puck.y, puck.ghostY]   = [puck.ghostY, puck.y];
    [puck.vx, puck.ghostVx] = [puck.ghostVx, puck.vx];
    [puck.vy, puck.ghostVy] = [puck.ghostVy, puck.vy];
    puck.prevX = puck.x; puck.prevY = puck.y;
    puck.realIs = 0;
  }
}

// Dissolve-burst particles at a position (fake puck collapsing)
function burstAt(x, y, col) {
  for (let i = 0; i < 22; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*2.0, vy: (Math.random()-0.5)*2.0,
      life: 1, decay: 0.045 + Math.random()*0.04,
      r: puck.r * (0.2 + Math.random()*0.65),
      col,
    });
  }
}

// Collapse any quantum puck state → NORMAL.
// goalScored = true means called from triggerGoal (don't show mode badge again).
function collapseSplit(goalScored) {
  const prevMode = puck.mode;
  normaliseSplit();   // main puck is now the real one

  if (prevMode === "BELL") {
    // Both pucks are part of Bell pair — both collapse simultaneously.
    // The real one stays; both ghost positions burst.
    burstAt(puck.ghostX, puck.ghostY, "bell");
    // Also flash real puck position with a bright green pulse
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: puck.x + (Math.random()-0.5)*0.05,
        y: puck.y + (Math.random()-0.5)*0.05,
        vx: (Math.random()-0.5)*0.8, vy: (Math.random()-0.5)*0.8,
        life: 1, decay: 0.04 + Math.random()*0.03,
        r: puck.r * (0.3 + Math.random()*0.5),
        col: "bell-real",
      });
    }
    if (!goalScored) {
      showPuckModeBadge("NORMAL");
      qbotSay("Bell state measured! Entanglement collapsed — both outcomes correlated.");
    }
  } else {
    // SPLIT or ENTANGLED: ghost bursts, real stays
    burstAt(puck.ghostX, puck.ghostY, "split");
    if (!goalScored) {
      showPuckModeBadge("NORMAL");
      qbotSay("Wave function collapsed! The real puck is revealed.");
    }
  }

  puck.mode = "NORMAL";
  puck.splitTimer = 0;
}

function checkGoal() {
  const goalHalfW = GOAL_W / 2;
  const goalCY    = FIELD_H / 2;

  // Real puck (always in main slot after normalise)
  if (puck.prevX - puck.r >= 0 && puck.x - puck.r < 0) {
    const t = puck.prevX / (puck.prevX - puck.x + 1e-5);
    if (Math.abs(puck.prevY + t*(puck.y-puck.prevY) - goalCY) < goalHalfW) triggerGoal(1);
  }
  if (puck.prevX + puck.r <= FIELD_W && puck.x + puck.r > FIELD_W) {
    const t = (FIELD_W-puck.prevX) / (puck.x-puck.prevX+1e-5);
    if (Math.abs(puck.prevY + t*(puck.y-puck.prevY) - goalCY) < goalHalfW) triggerGoal(0);
  }

  // In BELL mode the ghost puck is a REAL physical copy that can also score
  // (it's the entangled partner — entering its goal is a measurement event)
  if (puck.mode === "BELL") {
    const gpx = puck.ghostX, gpy = puck.ghostY;
    if (gpx - puck.r < 0 && Math.abs(gpy - goalCY) < goalHalfW) {
      // Ghost entered LEFT goal — counts as P1 (right) scoring
      puck.realIs = 1;    // ghost is now "the real one" that scored
      triggerGoal(1);
    }
    if (gpx + puck.r > FIELD_W && Math.abs(gpy - goalCY) < goalHalfW) {
      puck.realIs = 1;
      triggerGoal(0);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// GOAL / WIN LOGIC
// ═══════════════════════════════════════════════════════════════════════════
function triggerGoal(scorer) {
  if (state.phase !== "play") return;
  state.score[scorer]++;
  state.lastGoalBy = scorer;
  state.phase = "goal";
  state.rallyCount = 0;

  // Collapse any quantum mode before scoring — normalises main = real
  if (puck.mode !== "NORMAL") collapseSplit(true);

  // Quantum: measure on goal → collapse state
  if (gameMode === "quantum") {
    const result = QE.measure(scorer);
    updateQubitStateUI();
    qbotSay(`GOAL! Measurement result: |${result}⟩ — wave function collapsed.`);
  }

  playSound("goal");
  showGoalOverlay(scorer);
  refreshGateBtnStates();

  if (state.score[scorer] >= GOALS_TO_WIN) {
    setTimeout(() => showWin(scorer), GOAL_PAUSE_MS);
  } else {
    setTimeout(() => startCountdown(), GOAL_PAUSE_MS);
  }
}

function startCountdown() {
  state.phase = "countdown";
  state.countdown = 3;
  resetPuck(state.lastGoalBy);
  resetPaddles();
  hideGoalOverlay();
  countdownTick();
}

function countdownTick() {
  if (state.countdown <= 0) { state.phase = "play"; refreshGateBtnStates(); return; }
  state.countdown--;
  setTimeout(countdownTick, COUNTDOWN_MS);
}

function showGoalOverlay(scorer) {
  const txt = document.getElementById("goal-text");
  txt.textContent = "GOAL!";
  txt.style.color = scorer === 0 ? "#3b82d4" : "#f97316";
  document.getElementById("goal-overlay").classList.add("show");
}
function hideGoalOverlay() { document.getElementById("goal-overlay").classList.remove("show"); }

function showWin(winner) {
  state.phase = "win";
  hideGoalOverlay();
  document.getElementById("win-label").textContent = winner === 0 ? "Player 1 Wins!" : "Player 2 Wins!";
  document.getElementById("win-label").style.color  = winner === 0 ? "#3b82d4" : "#f97316";
  document.getElementById("win-score").textContent  = `${state.score[0]}  :  ${state.score[1]}`;
  document.getElementById("win-score").style.color  = winner === 0 ? "#3b82d4" : "#f97316";

  // Education summary
  const totalGates = gateLog.length;
  const bellCount = gateLog.filter(g => g.gate === "CNOT").length;
  document.getElementById("win-edu").textContent = gameMode === "quantum"
    ? `${totalGates} gate${totalGates !== 1 ? "s" : ""} applied. ` +
      (bellCount ? `Bell state Φ⁺=(|00⟩+|11⟩)/√2 triggered ${bellCount}× — entangled puck pairs! ` : "") +
      `H=superposition · X=flip · Z=phase · CNOT=entangle`
    : "";

  document.getElementById("win-screen").classList.add("show");
}

// AUDIO
// ═══════════════════════════════════════════════════════════════════════════
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === "wall") {
    tone("square", 220, 0, 0.08, 0.07);
  } else if (type === "paddle") {
    const o = tone("sine", 440, 0, 0.15, 0.1);
    o.frequency.exponentialRampToValueAtTime(880, now + 0.04);
  } else if (type === "goal") {
    [[523,0,0.15],[659,0.14,0.2],[784,0.3,0.35]].forEach(([f,d,dur]) => tone("triangle", f, d, 0.25, dur));
  } else if (type === "gate_H") {
    // Whoosh sweep up
    const o = tone("sawtooth", 200, 0, 0.12, 0.3);
    o.frequency.exponentialRampToValueAtTime(800, now + 0.3);
  } else if (type === "gate_X") {
    // Sharp pop
    tone("square", 600, 0, 0.18, 0.08);
    tone("square", 300, 0.04, 0.1, 0.06);
  } else if (type === "gate_Z") {
    // Phase shimmer
    const o = tone("sine", 880, 0, 0.1, 0.25);
    o.frequency.setValueAtTime(880, now);
    o.frequency.linearRampToValueAtTime(440, now + 0.15);
    o.frequency.linearRampToValueAtTime(880, now + 0.3);
  } else if (type === "gate_CNOT") {
    // Double thump
    tone("triangle", 150, 0, 0.3, 0.15);
    tone("triangle", 250, 0.1, 0.2, 0.15);
    tone("sawtooth", 600, 0.0, 0.08, 0.3);
  }
}

function tone(type, freq, delay, vol, dur) {
  if (!audioCtx) return {};
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now + delay);
  gain.gain.setValueAtTime(vol, now + delay);
  gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
  osc.start(now + delay); osc.stop(now + delay + dur);
  return osc;
}

// ═══════════════════════════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════════════════════════
const particles = [];

function spawnTrailParticle(x, y, isGhost) {
  particles.push({
    x, y,
    vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
    life: 1, decay: 0.07 + Math.random()*0.05,
    r: puck.r * (0.3 + Math.random()*0.4),
    ghost: isGhost,
  });
  if (particles.length > 120) particles.shift();
}

function updateParticles() {
  if (state.phase === "play") {
    if (Math.hypot(puck.vx, puck.vy) > 0.5) spawnTrailParticle(puck.x, puck.y, false);
    if (puck.mode === "SPLIT" || puck.mode === "ENTANGLED" || puck.mode === "BELL") {
      if (Math.hypot(puck.ghostVx, puck.ghostVy) > 0.3) spawnTrailParticle(puck.ghostX, puck.ghostY, true);
    }
  }
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * PHYSICS_DT; p.y += p.vy * PHYSICS_DT;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════════════════════════════
function draw(alpha) {
  const tnow = Date.now();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ── Deep space background ──────────────────────────────────────────────
  ctx.fillStyle = "#04080f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(OX, OY);

  const W = px(FIELD_W), H = px(FIELD_H);

  // ── Field surface: layered radial glows (blue left, orange right) ──────
  const bgL = ctx.createRadialGradient(0, H/2, 0, 0, H/2, W * 0.7);
  bgL.addColorStop(0, "rgba(30,80,180,0.18)");
  bgL.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = bgL; ctx.fillRect(0, 0, W, H);

  const bgR = ctx.createRadialGradient(W, H/2, 0, W, H/2, W * 0.7);
  bgR.addColorStop(0, "rgba(180,60,10,0.15)");
  bgR.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = bgR; ctx.fillRect(0, 0, W, H);

  const bgC = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.4);
  bgC.addColorStop(0, "rgba(60,40,120,0.12)");
  bgC.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = bgC; ctx.fillRect(0, 0, W, H);

  // ── Quantum dot grid (subtle animated pulse) ───────────────────────────
  const gridSpX = px(0.19), gridSpY = px(0.1);
  const dotPulse = 0.4 + 0.3 * Math.sin(tnow / 1800);
  ctx.fillStyle = `rgba(80,160,255,${dotPulse * 0.18})`;
  for (let gx = gridSpX; gx < W - gridSpX*0.5; gx += gridSpX) {
    for (let gy = gridSpY; gy < H - gridSpY*0.5; gy += gridSpY) {
      const phase = Math.sin(tnow/2200 + gx*0.003 + gy*0.005);
      const r = px(0.004) * (0.6 + 0.4 * phase);
      ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI*2); ctx.fill();
    }
  }

  // ── Outer border — double neon ring ───────────────────────────────────
  // Outer soft glow pass
  ctx.shadowColor = "#00cfff";
  ctx.shadowBlur  = px(0.025);
  ctx.strokeStyle = "rgba(0,210,255,0.25)";
  ctx.lineWidth   = px(0.012);
  ctx.strokeRect(px(0.008), px(0.008), px(FIELD_W-0.016), px(FIELD_H-0.016));
  // Inner sharp neon line
  ctx.shadowBlur  = px(0.015);
  ctx.strokeStyle = "rgba(0,220,255,0.75)";
  ctx.lineWidth   = px(0.005);
  ctx.strokeRect(px(0.012), px(0.012), px(FIELD_W-0.024), px(FIELD_H-0.024));
  ctx.shadowBlur  = 0;

  // ── Corner arcs ────────────────────────────────────────────────────────
  const cornerR = px(0.065);
  const corners = [
    [px(0.012), px(0.012), 0, Math.PI/2],
    [px(FIELD_W-0.012), px(0.012), Math.PI/2, Math.PI],
    [px(FIELD_W-0.012), px(FIELD_H-0.012), Math.PI, 1.5*Math.PI],
    [px(0.012), px(FIELD_H-0.012), 1.5*Math.PI, 2*Math.PI],
  ];
  ctx.shadowColor = "#00cfff"; ctx.shadowBlur = px(0.018);
  ctx.strokeStyle = "rgba(0,220,255,0.5)"; ctx.lineWidth = px(0.005);
  corners.forEach(([cx2,cy2,sa,ea]) => {
    ctx.beginPath(); ctx.arc(cx2, cy2, cornerR, sa, ea); ctx.stroke();
  });
  ctx.shadowBlur = 0;

  // ── Centre line — neon dashed ──────────────────────────────────────────
  ctx.shadowColor = "#b060ff"; ctx.shadowBlur = px(0.022);
  ctx.setLineDash([px(0.028), px(0.022)]);
  ctx.strokeStyle = "rgba(190,110,255,0.7)";
  ctx.lineWidth   = px(0.005);
  ctx.beginPath(); ctx.moveTo(W/2, px(0.015)); ctx.lineTo(W/2, px(FIELD_H-0.015)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;

  // ── Centre circle — glowing ────────────────────────────────────────────
  ctx.shadowColor = "#b060ff"; ctx.shadowBlur = px(0.03);
  ctx.strokeStyle = "rgba(200,130,255,0.65)";
  ctx.lineWidth   = px(0.005);
  ctx.beginPath(); ctx.arc(W/2, H/2, px(0.145), 0, Math.PI*2); ctx.stroke();
  // Centre dot
  ctx.shadowBlur = px(0.02);
  ctx.fillStyle  = "rgba(220,160,255,0.8)";
  ctx.beginPath(); ctx.arc(W/2, H/2, px(0.012), 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // ── Goals — neon mouth + inner fill glow ──────────────────────────────
  const goalTop = px(FIELD_H/2 - GOAL_W/2);
  const goalBot = px(FIELD_H/2 + GOAL_W/2);
  const gd      = px(0.055);

  function drawGoal(x, dir, color, glowColor) {
    // Inner fill gradient
    const gFill = ctx.createLinearGradient(x, goalTop, x + dir * gd, goalTop);
    gFill.addColorStop(0, color.replace(")", ",0.25)").replace("rgb","rgba"));
    gFill.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gFill;
    ctx.fillRect(
      dir > 0 ? x : x + dir * gd,
      goalTop,
      Math.abs(gd),
      goalBot - goalTop
    );
    // Neon frame
    ctx.shadowColor = glowColor; ctx.shadowBlur = px(0.03);
    ctx.strokeStyle = color;
    ctx.lineWidth   = px(0.009);
    ctx.beginPath();
    ctx.moveTo(x, goalTop);
    ctx.lineTo(x + dir*gd, goalTop);
    ctx.lineTo(x + dir*gd, goalBot);
    ctx.lineTo(x, goalBot);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  drawGoal(0, -1, "rgba(59,130,212,0.9)",  "#3b82d4");   // left = blue
  drawGoal(W,  1, "rgba(249,115,22,0.9)",  "#f97316");   // right = orange

  // Particles (trail + collapse bursts)
  for (const p of particles) {
    ctx.beginPath();
    ctx.arc(px(p.x), px(p.y), px(p.r), 0, Math.PI*2);
    if (p.col === "bell")       ctx.fillStyle = `rgba(100,255,160,${p.life*0.5})`;
    else if (p.col === "bell-real") ctx.fillStyle = `rgba(80,220,120,${p.life*0.6})`;
    else if (p.col === "split") ctx.fillStyle = `rgba(180,120,255,${p.life*0.45})`;
    else if (p.ghost)           ctx.fillStyle = `rgba(200,120,255,${p.life*0.3})`;
    else                        ctx.fillStyle = `rgba(100,180,255,${p.life*0.4})`;
    ctx.fill();
  }

  const renderX = puck.prevX + (puck.x - puck.prevX) * alpha;
  const renderY = puck.prevY + (puck.y - puck.prevY) * alpha;
  const t_now   = Date.now();

  if (puck.mode === "SPLIT" || puck.mode === "ENTANGLED") {
    // ── Two IDENTICAL pucks — same gradient, same glow, only shimmer differs ──
    // Both shimmer independently (out of phase) — no colour difference.
    const ph0 = t_now / 300;
    const ph1 = ph0 + (puck.shimmerPhase || 1.8);  // out of phase

    // Connecting line (subtle)
    ctx.setLineDash([px(0.012), px(0.018)]);
    ctx.strokeStyle = `rgba(140,100,255,${0.15 + 0.1*Math.sin(ph0)})`;
    ctx.lineWidth = px(0.003);
    ctx.beginPath();
    ctx.moveTo(px(renderX), px(renderY));
    ctx.lineTo(px(puck.ghostX), px(puck.ghostY));
    ctx.stroke();
    ctx.setLineDash([]);

    // Ghost puck — identical appearance, shifted shimmer phase
    drawPuck(puck.ghostX, puck.ghostY, ph1);
    // Real puck
    drawPuck(renderX, renderY, ph0);

  } else if (puck.mode === "BELL") {
    // ── Bell state: both pucks look IDENTICAL but pulse IN PHASE ──────────
    // They shimmer together — the quantum correlation is visible.
    const ph = t_now / 220;

    // Entanglement arc (curved line connecting both pucks)
    const mx = (renderX + puck.ghostX) / 2;
    const my = (renderY + puck.ghostY) / 2;
    const bulge = Math.min(FIELD_W, FIELD_H) * 0.18 * Math.sin(ph * 0.5 + 0.5);
    ctx.beginPath();
    ctx.moveTo(px(renderX), px(renderY));
    ctx.quadraticCurveTo(px(mx), px(my - bulge), px(puck.ghostX), px(puck.ghostY));
    ctx.strokeStyle = `rgba(80,220,120,${0.35 + 0.2*Math.sin(ph)})`;
    ctx.lineWidth = px(0.005);
    ctx.setLineDash([px(0.02), px(0.015)]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Both pucks drawn identically and in-phase
    drawPuck(puck.ghostX, puck.ghostY, ph, true);
    drawPuck(renderX, renderY, ph, true);

  } else {
    // NORMAL mode — single puck
    drawPuck(renderX, renderY, t_now / 300);
  }

  // Paddles
  drawPaddle(paddles[0], "#3b82d4", "rgba(59,130,212,0.5)", "#79b8ff");
  drawPaddle(paddles[1], "#f97316", "rgba(249,115,22,0.5)",  "#fbbf7a");

  // Always reset shadow before restore so it doesn't leak into HUD
  ctx.shadowBlur = 0;
  ctx.shadowColor = "transparent";
  ctx.restore();

  drawHUD();

  if (state.phase === "countdown" && state.countdown > 0) {
    ctx.font = `bold ${px(0.3)}px system-ui`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.shadowColor = "#3b82d4"; ctx.shadowBlur = px(0.08);
    ctx.fillText(state.countdown, canvas.width/2, canvas.height/2);
    ctx.shadowBlur = 0;
  }
}

// phase: a time-based float for shimmer pulse
// bell: if true tint green (Bell state) — both pucks tinted equally
function drawPuck(x, y, phase, bell) {
  phase = phase || 0;
  const pulse = 0.85 + 0.15 * Math.sin(phase);   // 0.85–1.0 brightness pulse

  // Outer glow
  const glowR   = puck.r * 2.5;
  const glowCol = bell ? `rgba(60,210,120,${0.35 * pulse})` : `rgba(100,200,255,${0.35 * pulse})`;
  const pg = ctx.createRadialGradient(px(x),px(y),0, px(x),px(y),px(glowR));
  pg.addColorStop(0, glowCol);
  pg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.beginPath(); ctx.arc(px(x),px(y),px(glowR),0,Math.PI*2);
  ctx.fillStyle = pg; ctx.fill();

  // Body — identical gradient for both pucks in SPLIT/BELL
  ctx.beginPath(); ctx.arc(px(x),px(y),px(puck.r),0,Math.PI*2);
  const puckGrad = ctx.createRadialGradient(
    px(x-puck.r*0.25), px(y-puck.r*0.25), px(puck.r*0.1),
    px(x), px(y), px(puck.r)
  );
  if (bell) {
    puckGrad.addColorStop(0, `rgba(160,255,200,${pulse})`);
    puckGrad.addColorStop(0.5, `rgba(45,160,90,${pulse})`);
    puckGrad.addColorStop(1, `rgba(10,50,30,${pulse})`);
  } else {
    puckGrad.addColorStop(0, `rgba(174,230,255,${pulse})`);
    puckGrad.addColorStop(0.5, `rgba(59,130,212,${pulse})`);
    puckGrad.addColorStop(1, `rgba(26,63,111,${pulse})`);
  }
  ctx.fillStyle = puckGrad; ctx.fill();
  ctx.strokeStyle = bell ? `rgba(100,255,180,${0.6*pulse})` : `rgba(200,230,255,${0.6*pulse})`;
  ctx.lineWidth = px(0.004); ctx.stroke();
}

function drawPaddle(p, bodyHex, glowCol, rimCol) {
  const glow = ctx.createRadialGradient(px(p.x),px(p.y),0, px(p.x),px(p.y),px(p.r*2.2));
  glow.addColorStop(0, glowCol); glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.beginPath(); ctx.arc(px(p.x),px(p.y),px(p.r*2.2),0,Math.PI*2);
  ctx.fillStyle = glow; ctx.fill();

  ctx.beginPath(); ctx.arc(px(p.x),px(p.y),px(p.r),0,Math.PI*2);
  const pg = ctx.createRadialGradient(px(p.x-p.r*0.3),px(p.y-p.r*0.3),px(p.r*0.1), px(p.x),px(p.y),px(p.r));
  pg.addColorStop(0, lighten(bodyHex)); pg.addColorStop(1, darken(bodyHex));
  ctx.fillStyle = pg; ctx.fill();
  ctx.strokeStyle = rimCol; ctx.lineWidth = px(0.006); ctx.stroke();

  ctx.beginPath(); ctx.arc(px(p.x),px(p.y),px(p.r*0.45),0,Math.PI*2);
  ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = px(0.004); ctx.stroke();
}

function drawHUD() {
  const hh = Math.min(px(0.12), 54);
  const cy = hh / 2;

  // Frosted neon top bar
  ctx.fillStyle = "rgba(4,8,16,0.9)";
  ctx.fillRect(0, 0, canvas.width, hh);
  // Cyan hairline bottom edge
  ctx.fillStyle = "rgba(0,210,255,0.35)";
  ctx.fillRect(0, hh - 1, canvas.width, 1);

  if (gameMode !== "quantum") {
    ctx.fillStyle = "rgba(4,8,16,0.9)";
    ctx.fillRect(0, canvas.height - hh, canvas.width, hh);
    ctx.fillStyle = "rgba(0,210,255,0.35)";
    ctx.fillRect(0, canvas.height - hh, canvas.width, 1);
  }

  // P1 score — neon blue with glow
  ctx.font = `bold ${hh*0.55}px system-ui`;
  ctx.textBaseline = "middle";
  ctx.shadowColor = "#3b82d4"; ctx.shadowBlur = hh * 0.4;
  ctx.textAlign = "left";
  ctx.fillStyle = "#79b8ff";
  ctx.fillText("P1", hh*0.5, cy);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff";
  ctx.fillText(state.score[0], hh*1.6, cy);

  // P2 score — neon orange with glow
  ctx.shadowColor = "#f97316"; ctx.shadowBlur = hh * 0.4;
  ctx.textAlign = "right";
  ctx.fillStyle = "#fbbf7a";
  ctx.fillText("P2", canvas.width - hh*0.5, cy);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff";
  ctx.fillText(state.score[1], canvas.width - hh*1.6, cy);

  // Centre label
  ctx.textAlign = "center";
  ctx.font = `${hh*0.3}px system-ui`;
  ctx.fillStyle = "rgba(0,210,255,0.4)";
  ctx.fillText(`first to ${GOALS_TO_WIN}`, canvas.width/2, cy);

  if (gameMode !== "quantum") {
    ctx.font = `${hh*0.28}px system-ui`;
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillText("P1: WASD  |  P2: Arrow Keys  |  or Gamepad / Touch", canvas.width/2, canvas.height - hh/2);
  }
  // Ensure shadow never leaks out of HUD into next frame
  ctx.shadowBlur = 0;
  ctx.shadowColor = "transparent";
}

function lighten(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+70)},${Math.min(255,g+70)},${Math.min(255,b+70)})`;
}
function darken(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-40)},${Math.max(0,g-40)},${Math.max(0,b-40)})`;
}

// ═══════════════════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════════════════
function loop(timestamp) {
  requestAnimationFrame(loop);
  if (state.phase === "goal")      { draw(1); return; }
  if (state.phase === "countdown") { draw(1); return; }
  if (state.phase !== "play")      return;

  const dt = Math.min((timestamp - state.lastTime) / 1000, 0.05);
  state.lastTime = timestamp;
  state.accumulator += dt;

  collectInput();

  while (state.accumulator >= PHYSICS_DT) {
    stepPhysics(PHYSICS_DT);
    updateParticles();
    state.accumulator -= PHYSICS_DT;
  }

  draw(state.accumulator / PHYSICS_DT);
}

// ═══════════════════════════════════════════════════════════════════════════
// UI WIRING
// ═══════════════════════════════════════════════════════════════════════════
// Mode selector cards
document.querySelectorAll(".mode-card").forEach(card => {
  card.addEventListener("click", () => {
    document.querySelectorAll(".mode-card").forEach(c => c.classList.remove("active"));
    card.classList.add("active");
    gameMode = card.dataset.mode;
  });
});

function startGame() {
  resize();
  state.score = [0, 0];
  state.phase = "countdown";
  state.countdown = 3;
  state.lastGoalBy = 1;
  state.accumulator = 0;
  state.rallyCount = 0;
  state.energy = [ENERGY_MAX, ENERGY_MAX];
  resetPuck(1); resetPaddles();
  particles.length = 0;
  gateLog.length = 0;

  // Reset quantum engine
  QE.reset();
  updateQubitStateUI();
  updateEnergyUI();
  updateCircuitDisplay();

  document.getElementById("menu").style.display = "none";
  document.getElementById("win-screen").classList.remove("show");
  hideGoalOverlay();

  const gateBar = document.getElementById("gate-bar");
  if (gameMode === "quantum") {
    gateBar.classList.add("show");
    refreshGateBtnStates();
    qbotSay("Quantum mode active! Use gate buttons or Q/E/R/F and U/O/P/[ keys.");
  } else {
    gateBar.classList.remove("show");
  }

  ensureAudio();
  state.lastTime = performance.now();
  countdownTick();
}

document.getElementById("btn-start").addEventListener("click", startGame);
document.getElementById("btn-rematch").addEventListener("click", startGame);
document.getElementById("btn-menu-back").addEventListener("click", () => {
  state.phase = "menu";
  document.getElementById("win-screen").classList.remove("show");
  document.getElementById("gate-bar").classList.remove("show");
  document.getElementById("menu").style.display = "flex";
});

// Gate button clicks
document.querySelectorAll(".gate-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    ensureAudio();
    fireGate(btn.dataset.gate, parseInt(btn.dataset.player));
  });
  btn.addEventListener("touchend", e => {
    e.stopPropagation();
    ensureAudio();
    fireGate(btn.dataset.gate, parseInt(btn.dataset.player));
  });
});

canvas.addEventListener("touchstart", ensureAudio, { passive: true });
canvas.addEventListener("mousedown",  ensureAudio);

resize();
requestAnimationFrame(loop);
</script>
